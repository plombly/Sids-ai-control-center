name: laika

services:

  postgres:
    image: postgres:18-alpine
    container_name: laika-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - laika-internal

  redis:
    image: redis:8-alpine
    container_name: laika-redis
    restart: unless-stopped
    # Password: REDIS_PASSWORD from the root-only /etc/laika/redis.env
    # (scripts/enable-redis-password.sh). Without the file, no password.
    env_file:
      - path: /etc/laika/redis.env
        required: false
    command: ["sh", "-c", 'exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}']
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$$REDIS_PASSWORD"; fi; redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - laika-internal

  api:
    build:
      context: ./apps/api
    container_name: laika-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      LAIKA_NOTIFY_DIR: /notify
    # LAIKA_OPERATOR_TOKEN for write access (root-only file on the host,
    # outside the repo). Absent file: writes stay open, Web approve refused.
    env_file:
      - path: /etc/laika/operator.env
        required: false
      - path: /etc/laika/redis.env
        required: false
    # Project file browser (apps/api/file_routes.py): code read-only, app
    # data and staged code uploads writable. Repositories are only ever
    # written on the host (laika-project.py commit-upload).
    volumes:
      - /var/lib/laika/projects:/projects:ro
      - /var/lib/laika/project-data:/project-data
      - /var/lib/laika/uploads:/uploads
      # Project secrets (apps/api/env_routes.py), written here, read only by
      # each app's systemd unit on the host.
      - /etc/laika/project-env:/project-env
      # Live job logs (apps/api/log_routes.py), read-only.
      - /var/log/laika/jobs:/job-logs:ro
      # Notification targets (apps/api/notify_routes.py), write-only from the page.
      - /etc/laika/notify:/notify
      # AI provider API keys (apps/api/provider_routes.py), write-only from the page.
      - /etc/laika/providers:/providers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Only nginx (laika-web, port 8080) talks to the API: one way in, real
    # client addresses for sign-in limits and the audit log.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['status'] == 'healthy'"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - laika-internal

  web:
    build:
      context: ./apps/web
    container_name: laika-web
    restart: unless-stopped
    # Host networking lets nginx see real client addresses (sign-in audit
    # and rate limits); it listens on 8080.
    depends_on:
      api:
        condition: service_healthy
    network_mode: host

networks:
  laika-internal:
    name: laika-internal
