services:

  postgres:
    image: postgres:18-alpine
    container_name: sid-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sid-ai-internal

  redis:
    image: redis:8-alpine
    container_name: sid-ai-redis
    restart: unless-stopped
    # Password: REDIS_PASSWORD from the root-only /etc/sid-ai/redis.env
    # (scripts/enable-redis-password.sh). Without the file, no password.
    env_file:
      - path: /etc/sid-ai/redis.env
        required: false
    command: ["sh", "-c", 'exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}']
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$$REDIS_PASSWORD"; fi; redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sid-ai-internal

  api:
    build:
      context: ./apps/api
    container_name: sid-ai-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
    # SID_OPERATOR_TOKEN for write access (root-only file on the host,
    # outside the repo). Absent file: writes stay open, Web approve refused.
    env_file:
      - path: /etc/sid-ai/operator.env
        required: false
      - path: /etc/sid-ai/redis.env
        required: false
    # Project file browser (apps/api/file_routes.py): code read-only, app
    # data and staged code uploads writable. Repositories are only ever
    # written on the host (sid-project.py commit-upload).
    volumes:
      - /opt/sid-projects:/projects:ro
      - /opt/sid-project-data:/project-data
      - /opt/sid-uploads:/uploads
      # Project secrets (apps/api/env_routes.py), written here, read only by
      # each app's systemd unit on the host.
      - /etc/sid-ai/project-env:/project-env
      # Live job logs (apps/api/log_routes.py), read-only.
      - /var/log/sid-ai/jobs:/job-logs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['status'] == 'healthy'"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sid-ai-internal

  web:
    build:
      context: ./apps/web
    container_name: sid-ai-web
    restart: unless-stopped
    # Same token file as the api: nginx adds it to /api requests from other
    # machines only. Host networking lets nginx see real client addresses
    # and this server's own ones (apps/web/nginx.conf); it listens on 8080.
    env_file:
      - path: /etc/sid-ai/operator.env
        required: false
    volumes:
      # Friendly app addresses, written by services/apps/sid_apps.py.
      - /opt/sid-nginx:/etc/nginx/sid-apps:ro
    depends_on:
      api:
        condition: service_healthy
    network_mode: host

networks:
  sid-ai-internal:
    name: sid-ai-internal
