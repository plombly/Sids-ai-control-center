# The web container uses the host's network (docker-compose network_mode:
# host), so nginx sees real client addresses and, at start, lists this
# server's own addresses (sid-local-addrs.sh).
#
# The operator token is added only for requests from other machines (your
# PC). Requests from this server itself (loopback, its own addresses) and
# from docker networks get no token, so project code that SID builds and
# tests here cannot use the dashboard to approve, reject or delete.
geo $sid_local {
    default        0;
    127.0.0.0/8    1;
    ::1            1;
    172.16.0.0/12  1;   # docker networks
    include /etc/nginx/sid-local-addrs.conf;   # this server's own addresses
}
map $sid_local $sid_operator_token {
    1       "";
    default "${SID_OPERATOR_TOKEN}";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location /api/ {
        # File uploads (project file browser) stream straight to the API.
        client_max_body_size 1g;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overrides any client-supplied header; empty for local callers (see
        # the map above). Port 8000 still requires the token itself.
        proxy_set_header X-SID-Token $sid_operator_token;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
