server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The operator token is baked in at container start (nginx templates +
        # env_file): the dashboard never asks for it. Anyone who can reach this
        # port can act, by design for a single-operator LAN. Overrides any
        # client-supplied header. Port 8000 still requires the token itself.
        proxy_set_header X-SID-Token "${SID_OPERATOR_TOKEN}";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
