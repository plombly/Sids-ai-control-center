# The web container uses the host's network (docker-compose network_mode:
# host) and listens on 8080. Everyone signs in (apps/api/auth.py): this
# proxy adds no credentials of its own and drops any operator token a
# browser might send.
server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The dashboard is a single page; its files never need to be framed.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location /api/ {
        # File uploads (project file browser) stream straight to the API.
        client_max_body_size 1g;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:8000;
        # $http_host keeps the port (":8080"): the API compares it with the
        # browser's Origin header before accepting a signed-in write.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Laika-Token "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
