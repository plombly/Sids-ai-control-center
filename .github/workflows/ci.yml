# Every push and pull request runs LAIka's gate (scripts/integration-check.py)
# without the checks that need a running server, plus the release scan.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sandbox (bubblewrap) for the tests that run it
        run: sudo apt-get install -y -q bubblewrap
      - name: Python packages
        run: pip install -r deploy/requirements-dev.lock
      - name: Gate
        env:
          LAIKA_PYTHON: python
          REPO_ROOT: ${{ github.workspace }}
          LAIKA_GATE_SKIP: local-diagnostic
          INTEGRATION_RESULT_DIR: ${{ runner.temp }}/gate
        run: python scripts/integration-check.py
      - name: Generated docs are up to date
        run: python scripts/laika-docs.py --check
      - name: No secrets in the tree
        run: python scripts/laika-release.py check
